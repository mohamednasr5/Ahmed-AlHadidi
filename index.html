<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - مكتب النائب أحمد الحديدي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        h2 {
            color: #1a2a6c;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        
        .input-group {
            margin-bottom: 25px;
            text-align: right;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #1a2a6c;
            box-shadow: 0 0 0 3px rgba(26, 42, 108, 0.1);
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: #1a2a6c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        
        button:hover {
            background: #0d1c5c;
            transform: translateY(-2px);
        }
        
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        
        .error {
            background: #fff2f2;
            color: #b21f1f;
            border: 1px solid #b21f1f;
        }
        
        .success {
            background: #f0fff4;
            color: #27ae60;
            border: 1px solid #27ae60;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2><i class="fas fa-lock"></i> دخول المسؤول</h2>
        
        <div class="input-group">
            <label for="adminPass">كلمة المرور</label>
            <input type="password" id="adminPass" placeholder="أدخل كلمة المرور" autofocus>
        </div>
        
        <button id="loginBtn">دخول</button>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('adminPass');
            const loginBtn = document.getElementById('loginBtn');
            const messageDiv = document.getElementById('message');
            
            // كلمة المرور الافتراضية
            const ADMIN_PASSWORD = "Ahmed123";
            
            // تركيز على حقل الإدخال تلقائياً
            passwordInput.focus();
            
            // حدث الضغط على زر الدخول
            loginBtn.addEventListener('click', function() {
                const password = passwordInput.value.trim();
                
                if (!password) {
                    showMessage('الرجاء إدخال كلمة المرور', 'error');
                    return;
                }
                
                if (password === ADMIN_PASSWORD) {
                    showMessage('تم تسجيل الدخول بنجاح!', 'success');
                    // هنا يمكنك توجيه المستخدم إلى لوحة التحكم
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showMessage('كلمة المرور غير صحيحة', 'error');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            });
            
            // الدخول بالضغط على Enter
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });
            
            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = 'message ' + type;
                messageDiv.style.display = 'block';
                
                // إخفاء الرسالة بعد 3 ثواني
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
