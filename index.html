<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;
        connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebase.com;
        img-src 'self' data: https:;
    ">
    <title>لوحة التحكم - مكتب النائب أحمد الحديدي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a2a6c;
            --secondary: #b21f1f;
            --accent: #27ae60;
            --light: #f8f9fa;
            --dark: #343a40;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Cairo', Tahoma, sans-serif; }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--dark);
            line-height: 1.6;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(to right, var(--primary), #2a3a8c);
            color: white;
            border-radius: 16px;
            box-shadow: var(--shadow);
            animation: fadeInDown 0.8s ease-out;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            transition: var(--transition);
            border-top: 5px solid var(--primary);
        }

        .form-group { margin-bottom: 20px; text-align: right; }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--light-gray);
            border-radius: 10px;
            font-size: 16px;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 42, 108, 0.1);
        }

        .btn {
            padding: 15px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
        }

        .btn:hover { transform: translateY(-3px); opacity: 0.9; }

        .member-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            border-right: 5px solid var(--accent);
            position: relative;
        }

        .link-display {
            color: var(--accent);
            word-break: break-all;
            font-size: 13px;
            background: #f0fdf4;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border: 1px dashed #27ae60;
        }

        .copy-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            border-right: 5px solid var(--accent);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        .loading { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-left: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <i class="fas fa-landmark" style="font-size: 2.5rem; margin-bottom: 10px;"></i>
        <h1>لوحة التحكم - مكتب النائب أحمد الحديدي</h1>
        <p>نظام إدارة الأعضاء وتوليد روابط التحقق الشخصية</p>
    </div>

    <div class="container">
        <!-- قسم تسجيل الدخول -->
        <div id="login-section" class="card">
            <h2 style="margin-bottom: 20px;"><i class="fas fa-lock"></i> تسجيل دخول المسؤول</h2>
            <div class="form-group">
                <input type="password" id="adminPass" placeholder="أدخل كلمة السر (742018)" autocomplete="current-password">
            </div>
            <button class="btn" id="loginBtn">دخول</button>
        </div>

        <!-- قسم الإدارة -->
        <div id="admin-section" class="card" style="display:none;">
            <h2 style="margin-bottom: 20px;"><i class="fas fa-user-plus"></i> إضافة عضو جديد</h2>
            <div class="form-group">
                <input type="text" id="name" placeholder="الاسم الرباعي" autocomplete="name">
            </div>
            <div class="form-group">
                <input type="text" id="nationalId" placeholder="الرقم القومي" autocomplete="off">
            </div>
            <div class="form-group">
                <input type="text" id="address" placeholder="محل الإقامة" autocomplete="street-address">
            </div>
            <button class="btn" id="addBtn">حفظ وتوليد الرابط</button>
            
            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">
            
            <div class="members-container">
                <h3 style="margin-bottom: 15px;"><i class="fas fa-users"></i> الأعضاء المسجلين</h3>
                <div id="membersList"></div>
            </div>
            
            <button class="btn" id="logoutBtn" style="background: var(--secondary); margin-top: 20px;">خروج</button>
        </div>
    </div>

    <div id="notification" class="notification">
        <div style="display: flex; align-items: center; gap: 10px;">
            <i id="notifIcon" class="fas fa-check-circle"></i>
            <span id="notifMessage"></span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD1ReoAPI53LweugEUbpb7SnD9iJoEPPcs",
            authDomain: "verify-39eda.firebaseapp.com",
            projectId: "verify-39eda",
            storageBucket: "verify-39eda.firebasestorage.app",
            messagingSenderId: "36549490854",
            appId: "1:36549490854:web:79b4ab27672d54b005dc67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function toast(msg, type = 'success') {
            const n = document.getElementById('notification');
            const m = document.getElementById('notifMessage');
            const i = document.getElementById('notifIcon');
            m.innerText = msg;
            n.style.display = 'block';
            n.style.borderRightColor = type === 'success' ? '#27ae60' : '#b21f1f';
            i.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-triangle';
            i.style.color = type === 'success' ? '#27ae60' : '#b21f1f';
            setTimeout(() => n.style.display = 'none', 3000);
        }

        window.copyToClipboard = (text) => {
            navigator.clipboard.writeText(text).then(() => toast('تم نسخ الرابط بنجاح!'));
        };

        document.getElementById('loginBtn').onclick = () => {
            const pass = document.getElementById('adminPass').value;
            if(pass === '742018') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-section').style.display = 'block';
                loadMembers();
            } else {
                toast('كلمة السر خاطئة', 'error');
            }
        };

        document.getElementById('addBtn').onclick = async () => {
            const name = document.getElementById('name').value;
            const nid = document.getElementById('nationalId').value;
            const addr = document.getElementById('address').value;

            if(!name || !nid) return toast('يرجى إكمال البيانات الأساسية', 'error');

            const btn = document.getElementById('addBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> جاري الحفظ...';

            try {
                await addDoc(collection(db, "members"), {
                    name, nationalId: nid, address: addr, createdAt: new Date()
                });
                toast('تمت الإضافة بنجاح');
                document.getElementById('name').value = '';
                document.getElementById('nationalId').value = '';
                document.getElementById('address').value = '';
                loadMembers();
            } catch (e) {
                toast('حدث خطأ في الاتصال بالخادم', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'حفظ وتوليد الرابط';
            }
        };

        async function loadMembers() {
            const list = document.getElementById('membersList');
            list.innerHTML = '<p style="text-align:center;">جاري تحميل البيانات...</p>';
            
            try {
                const q = query(collection(db, "members"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                list.innerHTML = '';

                if(snap.empty) list.innerHTML = '<p style="text-align:center; color:#999;">لا يوجد أعضاء مسجلين حالياً</p>';

                snap.forEach(doc => {
                    const data = doc.data();
                    const url = `https://mohamednasr5.github.io/Ahmed-Al-Hadidi/verify.html?id=${doc.id}`;
                    list.innerHTML += `
                        <div class="member-card">
                            <p><strong><i class="fas fa-user"></i> الاسم:</strong> ${data.name}</p>
                            <p><strong><i class="fas fa-id-card"></i> الرقم القومي:</strong> ${data.nationalId}</p>
                            <div class="link-display">
                                <span>${url}</span>
                                <button class="copy-btn" onclick="copyToClipboard('${url}')">نسخ</button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                list.innerHTML = '<p style="text-align:center; color:red;">فشل تحميل البيانات</p>';
            }
        }

        document.getElementById('logoutBtn').onclick = () => location.reload();
    </script>
</body>
</html>
