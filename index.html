<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
        font-src 'self' https://cdnjs.cloudflare.com;
        connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebase.com;
        img-src 'self' data: https:;
    ">
    <title>لوحة التحكم - مكتب النائب أحمد الحديدي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a2a6c;
            --secondary: #b21f1f;
            --accent: #27ae60;
            --light: #f8f9fa;
            --dark: #343a40;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Cairo', sans-serif; }
        body { background: #f5f7fa; min-height: 100vh; padding: 20px; color: var(--dark); }

        .header {
            text-align: center; margin-bottom: 30px; padding: 20px;
            background: linear-gradient(to right, var(--primary), #2a3a8c);
            color: white; border-radius: 16px; box-shadow: var(--shadow);
        }

        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; padding: 30px; box-shadow: var(--shadow); margin-bottom: 30px; border-top: 5px solid var(--primary); }
        
        h2 { color: var(--primary); margin-bottom: 25px; position: relative; padding-bottom: 10px; }
        h2::after { content: ''; position: absolute; bottom: 0; right: 0; width: 60px; height: 4px; background: var(--secondary); border-radius: 2px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 16px; }
        input:focus { outline: none; border-color: var(--primary); }

        .btn {
            width: 100%; padding: 15px; background: var(--primary); color: white; border: none;
            border-radius: 10px; font-size: 18px; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }

        .member-card {
            background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 15px;
            border-right: 5px solid var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .link-display {
            background: #f8fff9; padding: 10px; border-radius: 8px; border: 1px dashed #27ae60;
            display: block; margin-top: 10px; font-size: 0.9rem; color: #27ae60; word-break: break-all;
        }

        .notification {
            position: fixed; bottom: 20px; left: 20px; background: white; padding: 15px 25px;
            border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); border-right: 4px solid var(--accent);
            z-index: 1000; transition: 0.5s;
        }
        .hidden { display: none; }
        .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; margin-left: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-landmark" style="font-size: 2.5rem; margin-bottom: 10px;"></i>
        <h1>لوحة التحكم - مكتب النائب أحمد الحديدي</h1>
        <p>نظام إدارة الأعضاء وتوليد روابط التحقق</p>
    </div>

    <div class="container">
        <!-- تسجيل الدخول -->
        <div id="login-section" class="card">
            <h2><i class="fas fa-lock"></i> دخول المسؤول</h2>
            <div class="form-group">
                <input type="password" id="adminPass" placeholder="أدخل كلمة السر">
            </div>
            <button class="btn" onclick="handleLogin()">دخول</button>
        </div>

        <!-- الإدارة -->
        <div id="admin-section" class="card" style="display:none;">
            <h2><i class="fas fa-user-plus"></i> إضافة عضو جديد</h2>
            <div class="form-group">
                <input type="text" id="name" placeholder="الاسم الرباعي">
            </div>
            <div class="form-group">
                <input type="text" id="nationalId" placeholder="الرقم القومي">
            </div>
            <div class="form-group">
                <input type="text" id="address" placeholder="محل الإقامة">
            </div>
            <button class="btn" id="addBtn" onclick="handleAddMember()">
                <span id="btnText"><i class="fas fa-save"></i> حفظ البيانات</span>
                <span id="btnSpinner" class="hidden"><span class="spinner"></span> جاري الحفظ...</span>
            </button>
            
            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">
            
            <h3><i class="fas fa-users"></i> الأعضاء المسجلون</h3>
            <div id="membersList" style="margin-top: 20px;"></div>
            
            <button class="btn" style="background: #666; margin-top: 20px;" onclick="location.reload()">تسجيل الخروج</button>
        </div>
    </div>

    <div id="notification" class="notification hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD1ReoAPI53LweugEUbpb7SnD9iJoEPPcs",
          authDomain: "verify-39eda.firebaseapp.com",
          projectId: "verify-39eda",
          storageBucket: "verify-39eda.firebasestorage.app",
          messagingSenderId: "36549490854",
          appId: "1:36549490854:web:79b4ab27672d54b005dc67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // جعل الدوال متاحة عالمياً للأزرار
        window.handleLogin = () => {
            const pass = document.getElementById('adminPass').value;
            if(pass === '742018') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-section').style.display = 'block';
                loadMembers();
            } else {
                alert('كلمة السر خاطئة');
            }
        };

        window.handleAddMember = async () => {
            const name = document.getElementById('name').value;
            const nid = document.getElementById('nationalId').value;
            const addr = document.getElementById('address').value;
            
            if(!name || !nid) return alert('يرجى ملء الاسم والرقم القومي');

            toggleBtn(true);
            try {
                await addDoc(collection(db, "members"), {
                    name,
                    nationalId: nid,
                    address: addr,
                    timestamp: serverTimestamp()
                });
                showNote('تمت الإضافة بنجاح');
                document.getElementById('name').value = '';
                document.getElementById('nationalId').value = '';
                document.getElementById('address').value = '';
                loadMembers();
            } catch(e) {
                console.error(e);
                alert('خطأ في الحفظ');
            } finally {
                toggleBtn(false);
            }
        };

        async function loadMembers() {
            const list = document.getElementById('membersList');
            list.innerHTML = 'جاري التحميل...';
            
            try {
                const q = query(collection(db, "members"), orderBy("timestamp", "desc"));
                const snap = await getDocs(q);
                list.innerHTML = '';
                
                snap.forEach((doc) => {
                    const data = doc.data();
                    const link = `https://mohamednasr5.github.io/Ahmed-Al-Hadidi/verify.html?id=${doc.id}`;
                    list.innerHTML += `
                        <div class="member-card">
                            <strong>${data.name}</strong><br>
                            <small>الرقم القومي: ${data.nationalId}</small>
                            <span class="link-display">${link}</span>
                        </div>
                    `;
                });
            } catch(e) {
                list.innerHTML = 'خطأ في تحميل البيانات';
            }
        }

        function toggleBtn(loading) {
            document.getElementById('btnText').className = loading ? 'hidden' : '';
            document.getElementById('btnSpinner').className = loading ? '' : 'hidden';
            document.getElementById('addBtn').disabled = loading;
        }

        function showNote(msg) {
            const n = document.getElementById('notification');
            n.textContent = msg;
            n.classList.remove('hidden');
            setTimeout(() => n.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
