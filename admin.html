<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - مكتب النائب أحمد الحديدي</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🏛️</div>
            <h1>لوحة الإدارة</h1>
            <p>مكتب النائب أحمد الحديدي</p>
            <a href="index.html" class="btn-back">
                <i class="fas fa-arrow-right"></i> العودة للرئيسية
            </a>
        </div>

        <!-- Login Section -->
        <div class="card" id="login-section">
            <h2 style="text-align: center; color: var(--primary); margin-bottom: 10px;">
                <i class="fas fa-shield-alt"></i> دخول المسؤول
            </h2>
            <p style="text-align: center; color: #666; margin-bottom: 30px;">
                أدخل كلمة مرور المسؤول للوصول إلى لوحة التحكم
            </p>

            <form onsubmit="return false;">
                <div class="form-group">
                    <label for="adminPass">
                        <i class="fas fa-key"></i> كلمة المرور
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="adminPass" 
                            placeholder="أدخل كلمة المرور"
                            autocomplete="off"
                        >
                    </div>
                </div>

                <button type="button" class="btn" id="loginBtn">
                    <span id="loginBtnText">
                        <i class="fas fa-sign-in-alt"></i> دخول
                    </span>
                    <span id="loginSpinner" class="spinner hidden"></span>
                </button>

                <div id="loginStatus" class="hidden"></div>

                <div style="background: #f0f7ff; padding: 15px; border-radius: 10px; margin-top: 20px; border-right: 4px solid var(--primary);">
                    <p style="margin: 0; font-size: 0.9rem; color: #555;">
                        <i class="fas fa-info-circle"></i> 
                        <strong>كلمة المرور الافتراضية:</strong> <code style="background: white; padding: 3px 8px; border-radius: 5px; color: var(--primary);">Ahmed123</code>
                    </p>
                </div>
            </form>
        </div>

        <!-- Admin Section (Hidden by default) -->
        <div id="admin-section" style="display: none;">
            <!-- Add Member Card -->
            <div class="card">
                <h2 style="color: var(--primary); margin-bottom: 20px;">
                    <i class="fas fa-user-plus"></i> إضافة عضو جديد
                </h2>

                <div class="form-group">
                    <label for="name">
                        <i class="fas fa-user"></i> الاسم الكامل *
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" placeholder="أدخل الاسم الكامل" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="nationalId">
                        <i class="fas fa-id-card"></i> الرقم القومي *
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card"></i>
                        <input 
                            type="text" 
                            id="nationalId" 
                            placeholder="أدخل الرقم القومي (14 رقم)"
                            maxlength="14"
                            pattern="\d{14}"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">
                        <i class="fas fa-map-marker-alt"></i> محل الإقامة
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" id="address" placeholder="أدخل العنوان (اختياري)">
                    </div>
                </div>

                <button type="button" class="btn btn-success" id="addBtn">
                    <span id="btnText">
                        <i class="fas fa-plus-circle"></i> إضافة العضو
                    </span>
                    <span id="btnSpinner" class="spinner hidden"></span>
                </button>
            </div>

            <!-- Members List Card -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
                    <h2 style="color: var(--primary); margin: 0;">
                        <i class="fas fa-users"></i> قائمة الأعضاء
                    </h2>
                    <button type="button" class="btn btn-secondary" id="logoutBtn" style="width: auto; padding: 12px 25px;">
                        <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                    </button>
                </div>

                <div id="membersList">
                    <div style="text-align: center; padding: 40px; color: #999;">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p style="margin-top: 15px;">جاري تحميل البيانات...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification hidden"></div>

    <!-- Firebase v9 Modular Scripts -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>

    <style>
        .btn-back {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.3);
            transform: translateX(5px);
        }

        code {
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }
    </style>
</body>
</html>
