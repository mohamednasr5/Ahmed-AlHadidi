<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - مكتب النائب أحمد الحديدي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <div class="logo">
            <i class="fas fa-landmark"></i>
        </div>
        <h1>لوحة التحكم - مكتب النائب أحمد الحديدي</h1>
        <p>نظام إدارة الأعضاء وتوليد روابط التحقق الآمنة</p>
    </div>

    <div class="container">
        <!-- قسم تسجيل الدخول -->
        <div id="login-section" class="card">
            <h2><i class="fas fa-lock"></i> دخول المسؤول</h2>
            <p style="color: #666; margin-bottom: 20px; text-align: center;">
                <i class="fas fa-info-circle"></i> الرجاء إدخال كلمة المرور للوصول إلى لوحة التحكم
            </p>
            
            <div class="form-group">
                <label for="adminPass"><i class="fas fa-key"></i> كلمة المرور</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="adminPass" placeholder="أدخل كلمة المرور" autocomplete="current-password">
                </div>
            </div>
            
            <!-- تأكد من type="button" -->
            <button class="btn" id="loginBtn" type="button">
                <span id="loginBtnText"><i class="fas fa-sign-in-alt"></i> دخول</span>
                <span id="loginBtnSpinner" class="hidden"><span class="spinner"></span> جاري التحقق...</span>
            </button>
            
            <div id="loginStatus" class="hidden"></div>
        </div>

        <!-- قسم الإدارة -->
        <div id="admin-section" class="card" style="display:none;">
            <h2><i class="fas fa-user-plus"></i> إضافة عضو جديد</h2>
            
            <div class="form-group">
                <label for="name"><i class="fas fa-user"></i> الاسم الرباعي</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="name" placeholder="أدخل الاسم الرباعي">
                </div>
            </div>
            
            <div class="form-group">
                <label for="nationalId"><i class="fas fa-id-card"></i> الرقم القومي</label>
                <div class="input-wrapper">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="nationalId" placeholder="أدخل الرقم القومي (14 رقم)" maxlength="14" inputmode="numeric">
                </div>
            </div>
            
            <div class="form-group">
                <label for="address"><i class="fas fa-map-marker-alt"></i> العنوان</label>
                <div class="input-wrapper">
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="text" id="address" placeholder="أدخل العنوان (اختياري)">
                </div>
            </div>
            
            <!-- تأكد من type="button" -->
            <button class="btn btn-success" id="addBtn" type="button">
                <span id="btnText"><i class="fas fa-save"></i> حفظ العضو</span>
                <span id="btnSpinner" class="hidden"><span class="spinner"></span> جاري الحفظ...</span>
            </button>
            
            <div id="addStatus" class="hidden"></div>
            
            <hr style="margin: 30px 0;">
            
            <h2><i class="fas fa-users"></i> الأعضاء المسجلون</h2>
            <div id="membersList">
                <p style="text-align:center;color:#666;">سيتم تحميل الأعضاء بعد تسجيل الدخول</p>
            </div>
            
            <!-- تأكد من type="button" -->
            <button class="btn btn-danger" id="logoutBtn" type="button" style="margin-top: 20px;">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>
        </div>
    </div>

    <div id="notification" class="notification hidden"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <!-- التطبيق الرئيسي -->
    <script src="script.js"></script>
    
    <!-- تهيئة Firebase -->
    <script>
        // إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD1ReoAPI53LweugEUbpb7SnD9iJoEPPcs",
            authDomain: "verify-39eda.firebaseapp.com",
            projectId: "verify-39eda",
            storageBucket: "verify-39eda.firebasestorage.app",
            messagingSenderId: "36549490854",
            appId: "1:36549490854:web:79b4ab27672d54b005dc67"
        };
        
        // تهيئة Firebase مرة واحدة فقط
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        window.db = firebase.firestore();
    </script>
</body>
</html>
