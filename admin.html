<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المسؤول</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .logo {
            font-size: 3rem;
            color: #1a2a6c;
            margin-bottom: 20px;
        }
        
        h2 {
            color: #333;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: #1a2a6c;
            outline: none;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: #1a2a6c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            background: #0d1c5c;
        }
        
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        
        .info {
            margin-top: 20px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <i class="fas fa-landmark"></i>
        </div>
        
        <h2>دخول المسؤول</h2>
        <p style="color: #666; margin-bottom: 20px;">أدخل كلمة مرور المسؤول للوصول</p>
        
        <div class="input-group">
            <label for="password">كلمة المرور</label>
            <input type="password" 
                   id="password" 
                   placeholder="أدخل كلمة المرور"
                   autofocus>
        </div>
        
        <button onclick="login()" type="button">دخول</button>
        
        <div id="message" class="message"></div>
        
        <div class="info">
            <p><i class="fas fa-info-circle"></i> كلمة المرور الافتراضية: <strong>Ahmed123</strong></p>
        </div>
    </div>

    <script>
        // كلمة المرور
        const ADMIN_PASSWORD = "Ahmed123";
        
        // التركيز على الحقل
        document.getElementById('password').focus();
        
        // الدخول بالإنتر
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
        
        // دالة تسجيل الدخول
        function login() {
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            // مسح الرسالة السابقة
            messageDiv.style.display = 'none';
            
            if (!password) {
                showMessage('الرجاء إدخال كلمة المرور', 'error');
                return;
            }
            
            // إظهار التحميل
            const button = document.querySelector('button');
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
            button.disabled = true;
            
            // محاكاة تأخير
            setTimeout(() => {
                if (password === ADMIN_PASSWORD) {
                    // حفظ حالة تسجيل الدخول - هذا السطر مهم جداً
                    localStorage.setItem('adminLoggedIn', 'true');
                    
                    showMessage('تم تسجيل الدخول بنجاح!', 'success');
                    
                    // الانتقال إلى لوحة التحكم
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                    
                } else {
                    showMessage('كلمة المرور غير صحيحة', 'error');
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
                
                // إعادة حالة الزر
                button.innerHTML = originalText;
                button.disabled = false;
                
            }, 1500);
        }
        
        // دالة عرض الرسائل
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }
        
        // التحقق من تسجيل الدخول السابق
        document.addEventListener('DOMContentLoaded', function() {
            const isLoggedIn = localStorage.getItem('adminLoggedIn');
            if (isLoggedIn === 'true') {
                showMessage('جاري إعادة التوجيه إلى لوحة التحكم...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 500);
            }
        });
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
