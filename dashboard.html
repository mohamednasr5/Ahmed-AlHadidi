<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المسؤول</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: #4CAF50;
            outline: none;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>دخول المسؤول</h2>
        <p>أدخل كلمة المرور:</p>
        
        <!-- هذا الحقل سيعمل 100% -->
        <input type="password" 
               id="password" 
               placeholder="كلمة المرور"
               autofocus>
        
        <button onclick="login()">دخول</button>
        
        <p id="message" style="color: red; margin-top: 10px;"></p>
    </div>

    <script>
        function login() {
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');
            
            if (password === 'Ahmed123') {
                message.textContent = 'تم الدخول بنجاح!';
                message.style.color = 'green';
                localStorage.setItem('loggedIn', 'true');
                
                // توجيه إلى لوحة التحكم
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                message.textContent = 'كلمة المرور غير صحيحة';
                message.style.color = 'red';
            }
        }
        
        // التركيز على الحقل عند تحميل الصفحة
        document.getElementById('password').focus();
    </script>
</body>
</html>
