<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد العضوية - مكتب النائب أحمد الحديدي</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --primary: #1a2a6c; --secondary: #b21f1f; --accent: #27ae60; --gold: #d4af37; --dark: #0a0a0a; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
body { background: var(--dark); color: white; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.header { text-align: center; margin-bottom: 30px; }
.logo { font-size: 4rem; color: var(--gold); animation: pulse 2s infinite; }
.header h1 { font-size: 2.2rem; background: linear-gradient(to right, var(--gold), #f4d03f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.success-box { background: linear-gradient(135deg, var(--accent), #2ecc71); padding: 25px; border-radius: 16px; margin: 20px 0; text-align: center; font-weight: bold; }
.data-card { background: #1a1a1a; border: 2px solid var(--gold); padding: 30px; border-radius: 20px; max-width: 500px; }
.row { border-bottom: 1px solid #333; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
.row:hover { background: rgba(255, 255, 255, 0.05); }
.label { color: var(--gold); font-weight: 600; display: flex; gap: 10px; }
.value { color: #f0f0f0; }
.warning { background: #fff; color: var(--secondary); padding: 20px; border-radius: 16px; display: flex; align-items: center; gap: 15px; margin-top: 30px; max-width: 500px; }
.call-icon { background: var(--secondary); color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; animation: ring 2s infinite; }
.spinner { width: 50px; height: 50px; border: 5px solid rgba(212,175,55,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
.verification-id { margin-top: 15px; font-size: 0.8rem; color: #999; text-align: center; }
#error { display: none; color: #ff6b6b; padding: 20px; border: 2px solid var(--secondary); border-radius: 15px; margin-top: 30px; max-width: 500px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes ring { 0%, 100% { transform: rotate(0deg); } 10%, 20% { transform: rotate(15deg); } }
</style>
</head>
<body>
<div class="header"><div class="logo"><i class="fas fa-landmark"></i></div><h1>تأكيد العضوية</h1><p>مكتب النائب أحمد الحديدي</p></div>
<div id="loader"><div class="spinner"></div><p>جاري التحقق من قاعدة البيانات...</p></div>
<div id="result" style="display:none; text-align: center;">
<div class="success-box"><i class="fas fa-check-circle"></i> تم التحقق بنجاح</div>
<div class="data-card"><div class="row"><span class="label"><i class="fas fa-user"></i> الاسم:</span><span class="value" id="res-name"></span></div><div class="row"><span class="label"><i class="fas fa-id-card"></i> الرقم القومي:</span><span class="value" id="res-id"></span></div><div class="row"><span class="label"><i class="fas fa-map-marker-alt"></i> العنوان:</span><span class="value" id="res-addr"></span></div><div class="verification-id" id="ver-id"></div></div>
<div class="warning"><div>للبلاغات التواصل مع مكتب النائب مباشرة</div><a href="tel:01000006622" class="call-icon"><i class="fas fa-phone-alt"></i></a></div>
</div>
<div id="error"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyD1ReoAPI53LweugEUbpb7SnD9iJoEPPcs", authDomain: "verify-39eda.firebaseapp.com", projectId: "verify-39eda", storageBucket: "verify-39eda.firebasestorage.app", messagingSenderId: "36549490854", appId: "1:36549490854:web:79b4ab27672d54b005dc67" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
async function verify() { try { const urlParams = new URLSearchParams(window.location.search); const memberId = urlParams.get('id'); if (!memberId) { showError("عذراً، لم يتم العثور على معرف عضو"); return; } const docRef = doc(db, "members", memberId); const docSnap = await getDoc(docRef); if (docSnap.exists()) { const data = docSnap.data(); document.getElementById('res-name').textContent = data.name || "غير مسجل"; document.getElementById('res-id').textContent = data.nationalId || "غير مسجل"; document.getElementById('res-addr').textContent = data.address || "غير مسجل"; document.getElementById('ver-id').textContent = `ID: ${memberId}`; document.getElementById('loader').style.display = 'none'; document.getElementById('result').style.display = 'block'; } else { showError("هذا العضو غير مسجل في المنظومة"); } } catch (error) { console.error(error); showError("حدث خطأ - حاول لاحقاً"); } }
function showError(msg) { document.getElementById('loader').style.display = 'none'; document.getElementById('error').textContent = msg; document.getElementById('error').style.display = 'block'; }
verify();
</script>
</body>
</html>
