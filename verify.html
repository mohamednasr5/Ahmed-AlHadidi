<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
        font-src 'self' https://cdnjs.cloudflare.com;
        connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebase.com;
        img-src 'self' data: https:;
    ">
    <title>تأكيد العضوية - مكتب النائب أحمد الحديدي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a2a6c;
            --secondary: #b21f1f;
            --accent: #27ae60;
            --gold: #d4af37;
            --dark: #0a0a0a;
            --dark-card: #1a1a1a;
            --light: #f8f9fa;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Cairo', Tahoma, sans-serif; }

        body {
            background: var(--dark);
            color: white;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 20% 30%, rgba(26, 42, 108, 0.1) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(178, 31, 31, 0.1) 0%, transparent 50%);
        }

        .header { text-align: center; margin-bottom: 30px; animation: fadeInDown 0.8s ease-out; }
        .logo { font-size: 4rem; margin-bottom: 15px; color: var(--gold); animation: pulse 2s infinite; }
        .header h1 { font-size: 2.2rem; background: linear-gradient(to right, var(--gold), #f4d03f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .success-box {
            background: linear-gradient(135deg, var(--accent), #2ecc71);
            padding: 20px; border-radius: 16px; margin: 20px 0; width: 100%; max-width: 500px;
            text-align: center; font-weight: bold; box-shadow: 0 8px 25px rgba(39, 174, 96, 0.3);
            border-left: 5px solid #1e8449; animation: slideInUp 0.6s ease-out 0.3s both;
        }

        .data-card {
            background: var(--dark-card); border: 2px solid var(--gold); padding: 30px; border-radius: 20px;
            width: 100%; max-width: 500px; position: relative; overflow: hidden; animation: slideInUp 0.6s ease-out 0.5s both;
        }

        .row { border-bottom: 1px solid #333; padding: 15px 10px; display: flex; justify-content: space-between; align-items: center; transition: var(--transition); }
        .row:hover { background: rgba(255, 255, 255, 0.05); transform: translateX(-5px); }
        .label { color: var(--gold); font-weight: 600; display: flex; gap: 10px; }
        .value { color: #f0f0f0; max-width: 60%; text-align: left; }

        .warning {
            background: #fff; color: var(--secondary); padding: 20px; border-radius: 16px;
            display: flex; align-items: center; gap: 15px; width: 100%; max-width: 500px;
            margin-top: 30px; border-right: 5px solid var(--secondary); animation: slideInUp 0.6s ease-out 0.7s both;
        }

        .call-icon {
            background: var(--secondary); color: white; width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; text-decoration: none;
            animation: ring 2s infinite;
        }

        #loader { text-align: center; color: var(--gold); }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(212, 175, 55, 0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }

        .verification-id { margin-top: 15px; font-size: 0.8rem; color: #666; font-family: monospace; text-align: center; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes ring { 0%, 100% { transform: rotate(0); } 10%, 20% { transform: rotate(15deg); } 15% { transform: rotate(-15deg); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><i class="fas fa-landmark"></i></div>
        <h1>تأكيد العضوية</h1>
        <p>مكتب النائب أحمد الحديدي</p>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p>جاري التحقق من قاعدة البيانات...</p>
    </div>

    <div id="result" style="display: none; width: 100%; max-width: 500px;">
        <div class="success-box">
            <i class="fas fa-check-circle"></i> تم التحقق بنجاح من بيانات العضو
        </div>
        
        <div class="data-card">
            <div class="row">
                <span class="label"><i class="fas fa-user"></i> الاسم:</span>
                <span class="value" id="res-name"></span>
            </div>
            <div class="row">
                <span class="label"><i class="fas fa-id-card"></i> الرقم القومي:</span>
                <span class="value" id="res-id"></span>
            </div>
            <div class="row">
                <span class="label"><i class="fas fa-map-marker-alt"></i> العنوان:</span>
                <span class="value" id="res-addr"></span>
            </div>
            <div class="verification-id" id="ver-id"></div>
        </div>

        <div class="warning">
            <div style="flex: 1;">للبلاغات أو الشكاوى يرجى التواصل مع مكتب النائب مباشرة</div>
            <a href="tel:01000006622" class="call-icon"><i class="fas fa-phone-alt"></i></a>
        </div>
    </div>

    <div id="error" style="display: none; color: #ff9999; text-align: center; padding: 20px; border: 1px solid var(--secondary); border-radius: 15px;"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD1ReoAPI53LweugEUbpb7SnD9iJoEPPcs",
          authDomain: "verify-39eda.firebaseapp.com",
          projectId: "verify-39eda",
          storageBucket: "verify-39eda.firebasestorage.app",
          messagingSenderId: "36549490854",
          appId: "1:36549490854:web:79b4ab27672d54b005dc67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function verify() {
            const urlParams = new URLSearchParams(window.location.search);
            const memberId = urlParams.get('id');

            if (!memberId) {
                showError("عذراً، لم يتم العثور على معرف عضو في الرابط.");
                return;
            }

            try {
                const docRef = doc(db, "members", memberId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('res-name').textContent = data.name || "غير مسجل";
                    document.getElementById('res-id').textContent = data.nationalId || "غير مسجل";
                    document.getElementById('res-addr').textContent = data.address || "غير مسجل";
                    document.getElementById('ver-id').textContent = `ID: ${memberId}`;
                    
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('result').style.display = 'block';
                } else {
                    showError("هذا العضو غير مسجل في منظومة مكتب النائب أحمد الحديدي.");
                }
            } catch (e) {
                console.error(e);
                showError("حدث خطأ أثناء الاتصال بالخادم، يرجى المحاولة لاحقاً.");
            }
        }

        function showError(msg) {
            document.getElementById('loader').style.display = 'none';
            const errDiv = document.getElementById('error');
            errDiv.textContent = msg;
            errDiv.style.display = 'block';
        }

        verify();
    </script>
</body>
</html>
